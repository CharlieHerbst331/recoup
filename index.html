<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recoup shared workspace</title>
  <style>
    body { margin: 12vh auto; max-width: 30rem; padding: 1.5rem; font: 18px/1.5 system-ui; color: #182c27; background: #f5f7f2; }
    h1 { font-size: 2.5rem; margin-bottom: .25rem; }
    label, input, button { display: block; box-sizing: border-box; width: 100%; }
    input, button { margin: .6rem 0 1.2rem; padding: .8rem; font: inherit; border-radius: .5rem; border: 1px solid #96a69c; }
    button { background: #245c45; color: white; cursor: pointer; }
    small { color: #51645b; }
  </style>
</head>
<body>
  <h1>Recoup</h1>
  <p>Your shared case workspace.</p>
  <form method="post" action="/api/workbench">
    <label for="secret">Shared access secret</label>
    <input id="secret" name="secret" type="password" autocomplete="current-password" required maxlength="1024">
    <button type="submit">Open workspace</button>
  </form>
  <p><small>Starting the workspace can take a moment. Sign in with the same access secret when Recoup opens.</small></p>
  <p><small>SYNTHETIC DATA · MOCK actions · LLM live</small></p>
</body>
</html>
