[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recoup"
version = "0.1.0"
description = "AR case workbench: proposed v1 contracts"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic==2.14.3",
    "typer==0.28.0",
    "streamlit==1.67.0",
    "openai==3.46.0",
    "pypdf==7.0.0",
]

[project.optional-dependencies]
ocr = ["pytesseract==0.3.13", "pillow==13.0.0"]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[project.scripts]
recoup = "recoup.cli:app"

[tool.setuptools.packages.find]
include = ["recoup*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
